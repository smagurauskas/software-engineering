project:
  render:
    - "*.qmd"

# Every lecture renders twice from the same source:
#   <name>.html        - readable course-notes page
#   <name>.slides.html - reveal.js slide deck
format:
  html:
    toc: true
    code-copy: true
    theme: cosmo
  revealjs:
    output-ext: slides.html
    embed-resources: true
    slide-level: 3
    # slides.scss keeps each heading at the top of its slide and centers
    # only the content below it.
    theme: [white, assets/slides.scss]
    slide-number: true
    code-line-numbers: true
    hash: true
    auto-stretch: false
    smaller: true
    center: false
    scrollable: true
    # Dots next to the slide number showing fragments left to reveal.
    include-after-body: assets/fragment-indicator.html

engine: markdown

# Show each executable C# cell's output under it, taken from the CI-verified
# golden expected/<name>.txt (Quarto itself does not run C#).
filters:
  - assets/cell-outputs.lua
  # Fills ```{.csharp include="path" region="name"} blocks with code from the
  # example projects, so excerpts are always the real, tested code.
  # Runs before Quarto's own filters, so the file name header is added too.
  - path: assets/include-region.lua
    at: pre-ast

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The lecture material must always render: broken markdown, a bad mermaid
  # diagram or an invalid Quarto directive fails the build, not the lecture.
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Render site (pages + slides)
        run: quarto render
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          retention-days: 14

  # The C# code inside the lectures must still work: every lecture with
  # `verify: output` must produce exactly the committed expected/<name>.txt,
  # and every `verify: run` lecture must execute without compile errors.
  # See tools/verify_lectures.py and README.md for how this works.
  verify-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Verify lecture code against expected outputs
        run: python tools/verify_lectures.py
      - name: Upload actual outputs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: actual-outputs
          path: .verify

  # The testing lecture demo (07-testing/): unit, integration and E2E tests.
  test-demo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 07-testing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Build frontend
        working-directory: 07-testing/WordGame.Web
        run: npm ci && npm run build
      - name: Build
        run: dotnet build
      - name: Install Playwright browser and its system dependencies
        run: pwsh WordGame.E2ETests/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium
      - name: Test
        run: dotnet test --no-build
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: 07-testing/WordGame.E2ETests/bin/Debug/net10.0/traces

  # The persistence lecture demo (08-persistence/): ORM demos against PostgreSQL,
  # started by Testcontainers in the runner's Docker.
  persistence-demo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 08-persistence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Test
        run: dotnet test --output Detailed

  # The software construction lecture demo (09-construction/), which builds on the
  # word game of 07-testing. The lecture quotes measured numbers from reports/:
  # measure.py re-measures them and fails if the code and the reports drifted apart.
  construction-demo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 09-construction
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build (analyzers enforce the coding standard)
        run: dotnet build WordGame.Construction.slnx
      - name: Check formatting
        run: |
          dotnet format whitespace WordGame.Construction.slnx --verify-no-changes
          dotnet format style WordGame.Construction.slnx --verify-no-changes
      - name: Test
        run: dotnet test --solution WordGame.Construction.slnx
      - name: Check the measurements quoted in the lecture
        run: |
          dotnet tool restore
          python3 measure.py --check
